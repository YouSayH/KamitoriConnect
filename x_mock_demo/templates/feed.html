<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>X Mock Feed</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000; color: #fff; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; border-left: 1px solid #2f3336; border-right: 1px solid #2f3336; min-height: 100vh; }
        .header { padding: 10px 16px; border-bottom: 1px solid #2f3336; font-weight: bold; font-size: 20px; backdrop-filter: blur(12px); position: sticky; top: 0; background: rgba(0,0,0,0.6); }
        .tweet { padding: 12px 16px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px; transition: background 0.2s; }
        .tweet:hover { background-color: #080808; }
        .avatar { width: 48px; height: 48px; background-color: #555; border-radius: 50%; }
        .content { flex: 1; }
        .user-info { margin-bottom: 2px; }
        .name { font-weight: bold; }
        .username { color: #71767b; margin-left: 4px; }
        .text { margin-bottom: 10px; line-height: 1.5; white-space: pre-wrap; }
        .media img { width: 100%; border-radius: 16px; border: 1px solid #2f3336; margin-top: 8px; }
        .time { color: #71767b; font-size: 0.9em; }
    </style>
    <meta http-equiv="refresh" content="5">
</head>
<body>
    <div class="container">
        <div class="header">ホーム (Demo)</div>
        {% for tweet in tweets %}
        <div class="tweet">
            <div class="avatar"></div> <div class="content">
                <div class="user-info">
                    <span class="name">Demo User</span>
                    <span class="username">@demo_account</span>
                    <span class="username">· {{ tweet.created_at.strftime('%H:%M') }}</span>
                </div>
                <div class="text">{{ tweet.text }}</div>
                {% if tweet.image_url %}
                <div class="media">
                    <img src="{{ tweet.image_url }}" alt="Posted Image">
                </div>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
